  <div class="workspace-label">OPERATE</div>
  <nav aria-label="Simulator tools">
    <a href="#runtime" data-nav="runtime"><span class="nav-icon">⌁</span> Simulator</a>
    <a href="#replay" data-nav="replay"><span class="nav-icon">▷</span> Recorded mission</a>
      <a href="#packets" data-nav="packets"><span class="nav-icon">≋</span> Packet inspector</a>
  </nav>
  <div class="workspace-label secondary-label">REFERENCE</div>
  <nav aria-label="Project reference">
    <a href="#system" data-nav="system"><span class="nav-icon">⬡</span> System reference</a>
    <a href="#requirements" data-nav="requirements"><span class="nav-icon">☷</span> Verification</a>
    <a href="#milestones" data-nav="milestones"><span class="nav-icon">↗</span> Milestones</a>

<div id="toast" role="status" aria-live="polite"></div>
<script src="packet-codec.js" defer></script>
<script src="link-view.js" defer></script>
<script src="app.js" defer></script>
